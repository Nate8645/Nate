<!doctype html>
<html lang="de">
<head>

  <link rel="stylesheet" href="/app.css">
  <style>

</head>
<body>
  <main class="video-shell">

      </div>
    </div>
    <section class="video-card" aria-label="UltraLaunch AI Tutorial Video">
      <video controls preload="metadata" poster="/og-card.svg">
